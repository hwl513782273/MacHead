name: 💡 功能建议 / Feature request
description: 新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Your use case
      description: 你想在什么情况下解决什么问题?(比实现方案更重要)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 你期望的交互或实现思路(可选)

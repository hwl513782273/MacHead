<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · 页面不存在 | MacHead</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      :root { color-scheme: light dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Segoe UI", sans-serif;
        background: #fbf9fa;
        color: #1d1a14;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14120b; color: #f4f1ea; }
        .code { color: rgba(244, 241, 234, 0.12); }
        .btn-secondary { color: #f4f1ea; border-color: rgba(244, 241, 234, 0.25); }
      }
      .code {
        font-size: clamp(96px, 24vw, 180px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        color: rgba(0, 0, 0, 0.06);
        user-select: none;
      }
      h1 { font-size: 22px; font-weight: 600; margin: 8px 0 10px; }
      p { font-size: 14px; opacity: 0.65; max-width: 400px; margin: 0 auto 28px; line-height: 1.7; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .btn {
        display: inline-block;
        padding: 10px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      .btn:hover { opacity: 0.85; }
      .btn-primary { background: #6d28d9; color: #fff; }
      .btn-secondary { border: 1px solid rgba(0, 0, 0, 0.18); color: #1d1a14; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>这一页合盖休眠了</h1>
      <p>你访问的页面不存在或已被移动。This page could not be found.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">返回首页</a>
        <a class="btn btn-secondary" href="/changelog.html">查看更新日志</a>
      </div>
    </main>
  </body>
</html>
